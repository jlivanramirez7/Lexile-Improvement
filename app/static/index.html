<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEACON Quest — V2 Reading Adventure &amp; Executive Telemetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            serif: ['"Lora"', 'Georgia', ' Cambria', 'serif'],
          },
          colors: {
            beacon: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#1e1b4b',
            }
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/v2_styles.css?v=20261005v5" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-200 selection:text-slate-900">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      
      <!-- Left: App Icon + BEACON Quest Title + Subject Switcher (📚 Reading | 📐 Math) -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div
          onclick="if (window.StudentUI && window.StudentUI.exitToHome) window.StudentUI.exitToHome();"
          class="flex items-center gap-2.5 cursor-pointer group select-none"
          title="Return Home"
        >
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white text-xl shadow-sm group-hover:scale-105 transition-transform">
            🧭
          </div>
          <div>
            <span class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-950 via-indigo-800 to-violet-700 bg-clip-text text-transparent">
              BEACON Quest
            </span>
          </div>
        </div>

        <!-- 2-Button Subject Switcher (Strictly <= 2 words per button) -->
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
          <button
            id="subject-btn-reading"
            type="button"
            onclick="window.switchSubject('reading')"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-xs cursor-pointer"
          >
            📚 Reading
          </button>
          <button
            id="subject-btn-math"
            type="button"
            onclick="window.switchSubject('math')"
            class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer"
          >
            📐 Math
          </button>
        </div>
      </div>

      <!-- Center (Visible in Student View): Streak Counter, Level Bar, & Student Selector -->
      <div id="nav-student-center" class="flex items-center gap-2.5 sm:gap-4">
        <!-- Streak Pill -->
        <div id="nav-streak-badge" class="flex items-center gap-1.5 bg-amber-50 border border-amber-200/80 text-amber-800 px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold shadow-2xs">
          <span>🔥</span>
          <span id="nav-streak-text">3 Days</span>
        </div>

        <!-- Level Bar -->
        <div class="hidden md:flex items-center gap-2.5 bg-slate-100/90 border border-slate-200/80 px-3.5 py-1.5 rounded-full">
          <span class="text-xs font-extrabold text-indigo-700 flex items-center gap-1">
            <span>⭐</span>
            <span id="nav-level-label">Level 2</span>
          </span>
          <div class="w-24 h-2.5 bg-slate-200 rounded-full overflow-hidden">
            <div id="nav-level-progress" class="h-full bg-gradient-to-r from-indigo-500 to-violet-500 rounded-full transition-all duration-500" style="width: 45%;"></div>
          </div>
          <span id="nav-xp-label" class="text-[11px] font-bold text-slate-600">450 XP</span>
        </div>

        <!-- Student Selector -->
        <div class="relative">
          <select
            id="nav-student-select"
            aria-label="Select Student"
            onchange="if (window.V2Engine && window.V2Engine.switchStudent) window.V2Engine.switchStudent(this.value);"
            class="appearance-none bg-slate-100 hover:bg-slate-200/70 text-slate-800 font-bold text-xs sm:text-sm rounded-xl pl-3 pr-8 py-2 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition cursor-pointer"
          >
            <option value="lucas">👦 Lucas Ramirez</option>
            <option value="evelyn_mietling">👧 Evelyn Mietling</option>
          </select>
          <span class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs">▼</span>
        </div>
      </div>

      <!-- Right: Mode Toggle Buttons (🎮 Practice & 📊 Parent) -->
      <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
        <button
          id="mode-btn-student"
          type="button"
          onclick="window.switchAppMode('student')"
          class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-xs"
        >
          🎮 Practice
        </button>
        <button
          id="mode-btn-parent"
          type="button"
          onclick="window.switchAppMode('parent')"
          class="px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900"
        >
          📊 Parent
        </button>
      </div>

    </div>
  </header>

  <!-- STUDENT VIEW (STRICT GATE 3: 1-3 WORDS MAX PER CONTROL, ZERO PSYCHOMETRIC JARGON) -->
  <main id="student-view" class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div id="student-root" class="w-full">
      <div class="flex flex-col items-center justify-center py-20 text-center">
        <div class="text-4xl mb-3 animate-bounce">🧭</div>
        <span class="badge inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-indigo-50 text-indigo-700 font-bold text-sm">
          ⏳ Loading Quests
        </span>
      </div>
    </div>
  </main>

  <!-- PARENT DASHBOARD VIEW (3-SECOND EXECUTIVE SCAN + DEEP DIAGNOSTICS + TRIAL INSPECTOR) -->
  <main id="parent-view" class="hidden flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <!-- Parent View Top Sub-Header with Classic V1 Discreet Link -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-200">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-0.5 rounded-md bg-indigo-950 text-indigo-200 text-[11px] font-extrabold uppercase tracking-wider">
            Executive Telemetry V2
          </span>
          <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">
            Parent Diagnostic &amp; Dickerson AC Readiness Dashboard
          </h1>
        </div>
        <p id="parent-subheader-caption" class="text-xs sm:text-sm text-slate-600 mt-0.5">
           Nickajack Elementary 5th Grade Official DRC BEACON Anchor (940L) &rarr; Dickerson MS 6th Grade AC Cutoff (1075L+)
        </p>
      </div>

      <div class="flex items-center gap-2.5">
        <a
          href="/v1"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200/80 border border-slate-200/80 transition"
          title="Open Classic V1 Simulator"
        >
          <span>🏛️</span>
          <span>Classic V1</span>
        </a>
        <button
          type="button"
          onclick="if (window.ParentUI && window.ParentUI.confirmResetProgress) window.ParentUI.confirmResetProgress();"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-700 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition"
        >
          <span>🔄</span>
          <span>Reset to 940L Baseline</span>
        </button>
      </div>
    </div>

    <!-- Dynamic Parent Dashboard Content Root -->
    <div id="parent-dashboard-root" class="space-y-6">
      <div class="text-center py-16 text-slate-500 font-medium">
        Loading Executive Telemetry...
      </div>
    </div>
  </main>

  <!-- FLOATING TOAST NOTIFICATION -->
  <div id="v2-toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- APPLICATION SCRIPTS -->
  <script>
    window.switchSubject = function(subject) {
      const cleanSubj = subject === 'math' ? 'math' : 'reading';
      const btnReading = document.getElementById('subject-btn-reading');
      const btnMath = document.getElementById('subject-btn-math');

      if (btnReading && btnMath) {
        if (cleanSubj === 'math') {
          btnMath.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-emerald-600 text-white shadow-xs cursor-pointer';
          btnReading.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer';
        } else {
          btnReading.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-xs cursor-pointer';
          btnMath.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900 cursor-pointer';
        }
      }

      if (window.V2State) {
        window.V2State.activeSubject = cleanSubj;
      }
      if (window.StudentUI && typeof window.StudentUI.setSubject === 'function') {
        window.StudentUI.setSubject(cleanSubj);
      }
      if (window.ParentUI && typeof window.ParentUI.setSubject === 'function') {
        window.ParentUI.setSubject(cleanSubj);
      }
    };

    window.switchAppMode = function(mode) {
      const studentView = document.getElementById('student-view');
      const parentView = document.getElementById('parent-view');
      const btnStudent = document.getElementById('mode-btn-student');
      const btnParent = document.getElementById('mode-btn-parent');

      if (mode === 'parent') {
        studentView.classList.add('hidden');
        parentView.classList.remove('hidden');
        btnParent.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-xs';
        btnStudent.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900';
        if (window.ParentUI && typeof window.ParentUI.renderDashboard === 'function') {
          window.ParentUI.renderDashboard();
        }
      } else {
        parentView.classList.add('hidden');
        studentView.classList.remove('hidden');
        btnStudent.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all bg-indigo-600 text-white shadow-xs';
        btnParent.className = 'px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all text-slate-600 hover:text-slate-900';
        if (window.StudentUI && typeof window.StudentUI.refreshHeader === 'function') {
          window.StudentUI.refreshHeader();
        }
      }
      if (window.V2State) {
        window.V2State.activeMode = mode;
      }
    };

    window.showV2Toast = function(message, tone = 'indigo') {
      const container = document.getElementById('v2-toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgMap = {
        indigo: 'bg-indigo-950 text-white border-indigo-700',
        emerald: 'bg-emerald-900 text-white border-emerald-600',
        amber: 'bg-amber-900 text-white border-amber-600',
        rose: 'bg-rose-900 text-white border-rose-600'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-xs sm:text-sm font-semibold flex items-center gap-2.5 transition-all duration-300 ${bgMap[tone] || bgMap.indigo}`;
      toast.innerHTML = `<span>✨</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    };
  </script>
  <script src="/static/js/state_and_telemetry.js?v=20261005v5"></script>
  <script src="/static/js/v1_math_bank.js?v=20261005v5"></script>
  <script src="/static/js/student_ui.js?v=20261008v1"></script>
  <script src="/static/js/parent_dashboard.js?v=20261005v5"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.V2Engine && typeof window.V2Engine.init === 'function') {
        window.V2Engine.init();
      }
    });
  </script>
</body>
</html>
