<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="14" />
  <circle cx="256" cy="256" r="142" fill="#1e1b4b" fill-opacity="0.45" stroke="url(#goldGrad)" stroke-width="10" />
  <!-- Cardinal ticks -->
  <line x1="256" y1="88" x2="256" y2="118" stroke="#fde047" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="394" x2="256" y2="424" stroke="#ffffff" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round" />
  <line x1="88" y1="256" x2="118" y2="256" stroke="#ffffff" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round" />
  <line x1="394" y1="256" x2="424" y2="256" stroke="#ffffff" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round" />
  <!-- Compass needle North (Gold) & South (White/Indigo) -->
  <polygon points="256,118 298,256 256,234 214,256" fill="url(#goldGrad)" />
  <polygon points="256,394 298,256 256,278 214,256" fill="#e0e7ff" />
  <circle cx="256" cy="256" r="22" fill="#ffffff" />
  <circle cx="256" cy="256" r="10" fill="#4f46e5" />
</svg>
